---
# Compose a blueprint at Red Hat when it is committed to the build-image
# branch. Deliberately not main: a build mutates state (it bumps the console's
# blueprint version and commits the new number back), so it runs on a branch
# you push to on purpose rather than on everything that lands on main.
#
# Two parts. Part 1 composes at Red Hat: the finished image lands in Red Hat's
# own GCP project, shared to whoever lab_share_with_accounts names, and the
# build manifest comes back as a workflow artifact. Part 2 — the `import` job
# at the bottom — copies that image into our project. It runs automatically
# once ENABLE_IMPORT is set, and does nothing at all until then.
# See README, "Building from CI".
name: Build image

"on":
  push:
    branches: [build-image]
    paths:
      - 'blueprints/*.yml'
  workflow_dispatch:
    inputs:
      blueprint:
        description: 'Blueprint slug (the filename in blueprints/ without .yml)'
        required: true
        type: string
      dry_run:
        description: 'Prove the credentials reach the API without composing'
        type: boolean
        default: false

# One build at a time. Two concurrent runs would race on
# blueprints/.remote-state.json and on pushing it back.
concurrency:
  group: build-image
  cancel-in-progress: false

jobs:
  # Which blueprints did this commit touch? Emitted as a JSON array so the build
  # job can fan out over it. Plain git rather than a changed-files action: this
  # repo takes no dependencies it does not need, and a third-party action on a
  # public repo with secrets is a dependency worth not having.
  select:
    runs-on: ubuntu-latest
    outputs:
      blueprints: ${{ steps.pick.outputs.blueprints }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Work out what to build
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          WANTED: ${{ inputs.blueprint }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = workflow_dispatch ]; then
            names="$WANTED"
          else
            # A force-push, or the first push to a branch, leaves `before`
            # pointing at something that is not in this clone.
            if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              BEFORE="$AFTER^"
            fi
            # --diff-filter=d: deleting a blueprint must not try to build it.
            names=$(git diff --name-only --diff-filter=d "$BEFORE" "$AFTER" \
                      -- 'blueprints/*.yml' \
                    | xargs -r -n1 basename \
                    | sed 's/\.yml$//')
          fi

          json=$(printf '%s\n' "$names" | sed '/^$/d' | jq -R . | jq -sc .)
          echo "blueprints=$json" >> "$GITHUB_OUTPUT"
          echo "Will build: $json" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: select
    if: needs.select.outputs.blueprints != '[]'
    runs-on: ubuntu-latest
    # The poll ceiling is ~63 min (lab_poll_cycles x retries x delay), so a
    # healthy-but-slow compose must not be killed as a hung job.
    timeout-minutes: 80
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Serial. Each build rewrites and pushes the same state file.
      max-parallel: 1
      matrix:
        blueprint: ${{ fromJSON(needs.select.outputs.blueprints) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Every role in this repo is pure ansible.builtin. No collections.
      - name: Install Ansible
        run: pip install 'ansible-core>=2.16'

      # rh_auth reads a file and has no environment-variable fallback, so the
      # secrets have to be materialised at the path group_vars expects.
      - name: Write the service account credentials
        env:
          RH_CLIENT_ID: ${{ secrets.RH_CLIENT_ID }}
          RH_CLIENT_SECRET: ${{ secrets.RH_CLIENT_SECRET }}
        run: |
          set -eu
          if [ -z "${RH_CLIENT_ID}" ] || [ -z "${RH_CLIENT_SECRET}" ]; then
            echo "::error::RH_CLIENT_ID and RH_CLIENT_SECRET are not set." \
                 "Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi
          mkdir -p ~/.config/redhat
          umask 077
          {
            printf 'RH_CLIENT_ID=%s\n' "$RH_CLIENT_ID"
            printf 'RH_CLIENT_SECRET=%s\n' "$RH_CLIENT_SECRET"
          } > ~/.config/redhat/lab-images.env

      # Pull hits the same API with the same token, so it proves the secrets,
      # the credentials file and rh_auth for free. It does NOT prove the
      # content-sources RBAC that POST /compose additionally needs.
      - name: Dry run
        if: ${{ inputs.dry_run }}
        env:
          BLUEPRINT: ${{ matrix.blueprint }}
        run: |
          set -eu
          ansible-playbook pull-blueprints.yml -e "blueprint=$BLUEPRINT"
          git checkout -- .
          echo "Credentials reach the API. Nothing was composed." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Compose the image
        if: ${{ !inputs.dry_run }}
        env:
          BLUEPRINT: ${{ matrix.blueprint }}
        run: ansible-playbook build-image.yml -e "blueprint=$BLUEPRINT"

      # Must run on failure too. rh_blueprint_push reconciles the state file
      # inside an `always:` block, so a failed compose still leaves the version
      # changed on disk — and a version that landed on the server without being
      # recorded here makes the next run's drift guard read our own push as
      # somebody's console edit, which wedges the repo.
      - name: Record the blueprint version
        if: ${{ always() && !inputs.dry_run }}
        env:
          BLUEPRINT: ${{ matrix.blueprint }}
          # The branch that triggered this run, not main. Recording the
          # version anywhere else would leave *this* branch stale and wedge
          # its next build on the drift guard.
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          STATE=blueprints/.remote-state.json

          if git diff --quiet -- "$STATE"; then
            echo "No version change to record."
            exit 0
          fi

          # The one key this build is entitled to have changed.
          entry=$(jq -c --arg k "$BLUEPRINT" '.[$k]' "$STATE")
          if [ "$entry" = null ]; then
            echo "::warning::$STATE changed but holds no entry for" \
                 "$BLUEPRINT. Not pushing."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'

          # Re-apply that key onto whatever $BRANCH holds *now*, rather than
          # rebasing our diff onto it. A build can hold this checkout for an
          # hour, and the next blueprint in the matrix — or a person — may
          # have recorded a different one meanwhile. The file is sorted JSON
          # six lines per key, so two neighbouring keys changing is precisely
          # the merge git is worst at, and a conflict here wedges the repo.
          # jq -S --indent 4 reproduces Ansible's to_nice_json byte for byte.
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git reset --hard FETCH_HEAD   # .build/ is untracked and survives

            jq -S --indent 4 --arg k "$BLUEPRINT" --argjson v "$entry" \
              '.[$k] = $v' "$STATE" > "$RUNNER_TEMP/state.json"
            mv "$RUNNER_TEMP/state.json" "$STATE"

            if git diff --quiet -- "$STATE"; then
              echo "Already recorded on $BRANCH."
              exit 0
            fi

            git commit -m "Record $BLUEPRINT version from CI build" -- "$STATE"
            if git push origin "HEAD:$BRANCH"; then
              echo "Recorded $BLUEPRINT $(jq -r .version <<<"$entry") on $BRANCH." \
                >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Push attempt $attempt lost a race; retrying."
            sleep 5
          done

          echo "::error::Could not push the updated $STATE. Until it is" \
               "committed by hand the next build will stop at the drift guard."
          exit 1

      - name: Upload the build manifest
        if: ${{ success() && !inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: build-manifest-${{ matrix.blueprint }}
          path: .build/*.json
          # .build is a dotted directory and upload-artifact skips hidden
          # paths by default, so without this the glob silently matches
          # nothing and the step fails on if-no-files-found.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  # ─── Part 2: import into GCP ───────────────────────────────────────────────
  # Runs automatically after a successful build, in the same run, over the
  # manifests that build just uploaded. Import only: verify and export are
  # both off, so this job never SSHes anywhere, never starts a VM and never
  # writes to a bucket.
  #
  # ENABLE_IMPORT is a one-time setup switch, not a per-run gate — it exists
  # so this is inert in the window before the GCP side is configured. Setup:
  # docs/ci-gcp-identity.md.
  import:
    needs: [select, build]
    if: ${{ vars.ENABLE_IMPORT == 'true' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    # Whole-job budget, not per image: this imports every manifest serially,
    # and `gcloud compute images create` blocks until GCP finishes. A minute
    # or two each plus ~3 for checkout/pip/auth, so 30 covers a handful of
    # blueprints with room. Raise it before raising the blueprint count — a
    # kill mid-create leaves the image built but its dated name out of the
    # log, and that name is what you would roll back to.
    timeout-minutes: 30
    permissions:
      contents: read
      # The runner asks GitHub for an OIDC token; this is what permits it.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Ansible
        run: pip install 'ansible-core>=2.16'

      # This run's artifacts only, so the import touches exactly what this run
      # built. merge-multiple flattens build-manifest-<slug>/<slug>.json down
      # to .build/<slug>.json, which is where lab_build_dir points.
      - name: Fetch the build manifests
        uses: actions/download-artifact@v8
        with:
          path: .build
          pattern: build-manifest-*
          merge-multiple: true

      # Keyless. GitHub mints an OIDC token, Google's STS exchanges it for a
      # federated token, and that impersonates GCP_SERVICE_ACCOUNT. No key
      # file exists anywhere and the credential dies with the runner.
      #
      # Impersonation rather than direct Workload Identity Federation, and not
      # by preference: Image Builder's share_with_accounts only accepts
      # user:/serviceAccount:/group:/domain: principals, so the import has to
      # run as something with a stable service account email. A federated
      # principalSet does not have one.
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          # Sets core/project. gcp_import passes --project on every call, but
          # gcp_export's `gcloud storage objects describe` does not — so an
          # ambient project is what stops a future export guessing.
          project_id: ${{ vars.GCP_PROJECT_ID }}

      # Load-bearing, not boilerplate: this is the step that runs
      # `gcloud auth login --cred-file` against the file written above.
      # Without it `gcloud auth list` is empty and gcp_target stops dead at
      # "No active gcloud account".
      - uses: google-github-actions/setup-gcloud@v3

      # One line answering "who was this?" ahead of all the Ansible output.
      # Every interesting failure below is really a question about identity.
      - name: Show which identity the import will run as
        run: |
          set -uo pipefail
          # No `set -e`, and `|| true` on both: if gcloud itself errors, the
          # whole point of this step is to still print what it managed to
          # work out. Failing before the echo would hide exactly the
          # diagnostic the step exists to produce. The explicit test at the
          # end is what fails the job.
          who=$(gcloud auth list --filter=status:ACTIVE --format='value(account)' 2>/dev/null || true)
          echo "Active account: ${who:-<none>}"
          echo "Project       : $(gcloud config get-value project 2>/dev/null || true)"
          if [ -z "$who" ]; then
            echo "::error::No active gcloud account. The auth step produced no" \
                 "usable credential, or setup-gcloud did not activate it." \
                 "See docs/ci-gcp-identity.md."
            exit 1
          fi
          # Only after the check — a summary saying "Importing as <none>" on
          # a run that imported nothing is worse than no summary.
          echo "Importing as \`${who}\`" >> "$GITHUB_STEP_SUMMARY"

      # verify=false: that phase SSHes to a throwaway VM and nothing in the
      # repo tunnels. Turning it on is a code change, not a flag — IAP would
      # have to go through the gcloud ssh path *and* be added as a
      # ProxyCommand to the inventory gcp_verify generates, which today has
      # none.
      #
      # export=false: export defaults to *true* in group_vars, and leaving it
      # on would start a Cloud Build job writing to gs://rhdp_images — which
      # other teams consume, and which this service account is deliberately
      # not permitted to do.
      - name: Import into GCP
        run: ansible-playbook import-image.yml -e verify=false -e export=false
