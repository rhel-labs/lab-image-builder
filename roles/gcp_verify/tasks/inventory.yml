---
# Hand the running VM to a plain `ansible-playbook` run.
#
# The user, key and address all come from `gcloud compute ssh --dry-run`,
# which prints the exact ssh command gcloud itself would run without running
# it. That is the only answer that is right in every case: the login name is
# derived from your account under plain metadata SSH but from the directory
# under OS Login, and guessing it wrong fails as "Permission denied" with no
# clue which of the two is in play.

- name: Ask gcloud how it would connect
  ansible.builtin.command: >-
    gcloud compute ssh {{ lab_vm }}
    --project {{ lab_target.project }}
    --zone {{ lab_target.zone }}
    --quiet --dry-run
  register: lab_ssh_dry
  changed_when: false

- name: Extract the connection details
  ansible.builtin.set_fact:
    lab_ssh_login: "{{ _login }}"
    lab_ssh_key: "{{ lab_ssh_dry.stdout | regex_search('-i\\s+(\\S+)', '\\1') | first | default('', true) }}"
  vars:
    _login: "{{ lab_ssh_dry.stdout_lines | last | trim | split(' ') | last }}"

- name: Assert the connection details parsed
  ansible.builtin.assert:
    that:
      - lab_ssh_login is search('@')
      - lab_ssh_key | length > 0
    fail_msg: |
      Could not read a user@host out of `gcloud compute ssh --dry-run`:

        {{ lab_ssh_dry.stdout | trim }}

      This is the one place Part 2 depends on gcloud's output format rather
      than its --format flag, because --dry-run has none.
    quiet: true

- name: Create a temporary inventory
  ansible.builtin.tempfile:
    state: file
    prefix: "lab-verify-{{ lab_vm }}-"
    suffix: .ini
  register: lab_inventory_file

- name: Remember the inventory path
  ansible.builtin.set_fact:
    lab_inventory: "{{ lab_inventory_file.path }}"

# Deliberately a real file rather than an inline host list: the path is
# printed on failure, so you can re-run the same playbook by hand against
# the surviving VM with the identical connection settings.
#
# A brand-new VM has a brand-new host key, so host key checking is off here.
# gcloud keeps its own known_hosts for the interactive path.
- name: Write the inventory
  ansible.builtin.copy:
    dest: "{{ lab_inventory }}"
    mode: "0600"
    content: |
      # Generated by lab-image-builder for {{ lab_image.name }}.
      # Deleted when the run finishes.
      [verify]
      {{ lab_vm }}

      [verify:vars]
      ansible_host={{ lab_ssh_login | split('@') | last }}
      ansible_user={{ lab_ssh_login | split('@') | first }}
      ansible_ssh_private_key_file={{ lab_ssh_key }}
      ansible_ssh_common_args=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes -o BatchMode=yes
      ansible_python_interpreter=/usr/bin/python3

      # No ansible_become here on purpose. These are ordinary playbooks and
      # should declare `become: true` themselves, so they behave the same way
      # when you run them by hand against a real lab VM. The login has
      # passwordless sudo.

      # Context, so a configuration playbook can branch on what it landed on.
      lab_image_name={{ lab_image.name }}
      lab_image_family={{ lab_image.family }}
      lab_image_slug={{ lab_image.slug }}
      lab_image_distribution={{ lab_image.distribution }}
      lab_gcp_project={{ lab_target.project }}
      lab_gcp_zone={{ lab_target.zone }}
      lab_gcp_instance={{ lab_vm }}

- name: Report the inventory
  ansible.builtin.debug:
    msg: >-
      Configuring {{ lab_ssh_login }} via {{ lab_inventory }}
