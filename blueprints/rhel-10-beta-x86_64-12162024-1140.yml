# Pulled from console.redhat.com by lab-images. Edit freely.
#
#   ansible-playbook pull-blueprints.yml                      # refresh from console
#   ansible-playbook build-image.yml -e blueprint=<this file> # push + compose
#
# name, description, distribution and customizations are what the API's
# blueprint write body accepts, and are the whole of what gets pushed.
# The GCP delivery target lives in group_vars/all/main.yml, not here.
#
# Lab images carry no `users:` (access is GCP metadata SSH) and no
# `subscription:` (nothing baked in). build-image.yml warns if either
# appears — a comment here would not survive the next pull.
customizations:
  files:
  - data: 
    data_encoding: base64
    ensure_parents: true
    path: /etc/systemd/system/custom-first-boot.service
  - data: IyEvYmluL2Jhc2gKdXNlcmFkZCByaGVsCnVzZXJtb2QgLWFHIHdoZWVsIHJoZWwKZWNobyByZWRoYXQgfCBwYXNzd2QgLS1zdGRpbiByaGVs
    data_encoding: base64
    ensure_parents: true
    mode: '0774'
    path: /usr/local/sbin/custom-first-boot
  packages:
  - cockpit
  - cockpit-files
  - cockpit-podman
  - cockpit-packagekit
  - cockpit-composer
  - cockpit-bridge
  - cockpit-pcp
  - cockpit-session-recording
  - cockpit-storaged
  - cockpit-system
  - subscription-manager-cockpit
  - rhel-system-roles
  services:
    enabled:
    - custom-first-boot
  subscription:
    activation-key: lab
    base-url: https://cdn.redhat.com/
    insights: true
    organization: 15765319
    rhc: false
    server-url: subscription.rhsm.redhat.com
description: ''
distribution: rhel-10-beta
name: rhel-10-beta-x86_64-12162024-1140
