# Pulled from console.redhat.com by lab-images. Edit freely.
#
#   ansible-playbook pull-blueprints.yml                      # refresh from console
#   ansible-playbook build-image.yml -e blueprint=<this file> # push + compose
#
# name, description, distribution and customizations are what the API's
# blueprint write body accepts, and are the whole of what gets pushed.
# The GCP delivery target lives in group_vars/all/main.yml, not here.
#
# Lab images carry no `users:` (access is GCP metadata SSH) and no
# `subscription:` (nothing baked in). build-image.yml warns if either
# appears — a comment here would not survive the next pull.
customizations:
  packages:
  - vim-enhanced
  - bash-completion
  - firewalld
description: ''
distribution: rhel-94
name: RHEL 9
