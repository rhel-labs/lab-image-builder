---
# ─── Credentials ─────────────────────────────────────────────────────────────
# Deliberately outside the repo so they can never be committed. Mode 0600.
#
#   RH_CLIENT_ID=...
#   RH_CLIENT_SECRET=...
#
# The service account must belong to a User Access group that grants Image
# Builder access. Without one it authenticates fine and then 403s on every
# call, which reads like a malformed request rather than a permissions gap.
rh_credentials_file: "{{ lookup('env', 'HOME') }}/.config/redhat/lab-images.env"

# ─── Endpoints ───────────────────────────────────────────────────────────────
rh_sso_token_url: "https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token"
rh_image_builder_api: "https://console.redhat.com/api/image-builder/v1"

# ─── Repo paths ──────────────────────────────────────────────────────────────
lab_blueprint_dir: "{{ playbook_dir }}/blueprints"
lab_state_file: "{{ lab_blueprint_dir }}/.remote-state.json"
lab_build_dir: "{{ playbook_dir }}/.build"

# ─── Build defaults ──────────────────────────────────────────────────────────
# Which blueprint to act on. Required by build-image.yml, optional for
# pull-blueprints.yml (empty = all). Defined here rather than in a role so
# that it is always defined: assert/fail messages are templated even when
# the assertion passes, so an undefined var in a message is a hard error.
blueprint: ""

# Override per run: -e lab_architecture=aarch64
lab_architecture: x86_64
lab_image_type: gcp

# Where Image Builder shares the finished image. Image Builder always writes
# into Red Hat's own GCP project and grants access to the principals named
# here — there is no way to make it write into ours, which is why the import
# is Part 2 and not a flag.
#
# This must name the principal Part 2 runs as. The two parts are coupled at
# exactly this one field; move the import to CI and this value changes too.
lab_share_with_accounts:
  - "user:myee@redhat.com"

# Injected into every blueprint at push time. Kept here, once, rather than in
# each blueprint file: what the image *is* belongs in the blueprint and is
# worth diffing; where it gets *delivered* is environmental and identical
# across all of them. It also means a blueprint pulled from the console never
# carries someone else's upload target into this repo.
lab_image_request:
  architecture: "{{ lab_architecture }}"
  image_type: "{{ lab_image_type }}"
  upload_request:
    type: "{{ lab_image_type }}"
    options:
      share_with_accounts: "{{ lab_share_with_accounts }}"

# ─── Compose polling ─────────────────────────────────────────────────────────
# The access token lives 900s and a GCP compose routinely outlives it. Polling
# is therefore split into cycles: each cycle re-authenticates, then polls for
# well under the token lifetime.
#   36 x 15s = 9 min per cycle, 7 cycles = ~63 min ceiling.
lab_poll_retries_per_cycle: 36
lab_poll_delay: 15
lab_poll_cycles: 7

# ─── Safety ──────────────────────────────────────────────────────────────────
# Overwriting a blueprint someone edited in the web console is the one
# genuinely destructive thing this repo can do. It requires -e force_push=true.
force_push: false

# ═══ Part 2 — import into GCP ════════════════════════════════════════════════
# Nothing below is used by Part 1, and Part 1 needs no GCP credentials.

# ─── Targets ─────────────────────────────────────────────────────────────────
# A target is "everywhere an image can land", named. Adding an environment is
# adding a key here, not editing a playbook: -e target=staging
#
# `machine_type` and `network` are only ever used by the throwaway smoke-test
# VM — this repo does not create lab VMs, it only publishes images for them.
target: lab

# A target may also carry:
#   provision:      extra configuration playbooks, run only for this target
#   export_bucket:  a different bucket than lab_export_bucket
#   export_format:  a different disk format than lab_export_format
lab_targets:
  lab:
    project: tmm-instruqt-11-26-2021
    zone: us-central1-a
    network: default
    machine_type: e2-medium
    export_bucket: rhdp_images

# ─── Verification ────────────────────────────────────────────────────────────
# Each imported image is booted as a throwaway VM, configured, tested over
# SSH, and deleted. -e verify=false imports and stops.
verify: true

# Configuration playbooks, run on the booted VM before any test. Ordinary
# standalone playbooks — nothing in them knows about this repo.
#   provision/default.yml                 every image
#   provision/<blueprint-slug>.yml        that blueprint only
#   lab_targets.<target>.provision        that target only
# Both convention paths are optional. Override the lot with a comma-separated
# list: -e provision=provision/rhsm.yml,provision/lab-users.yml
lab_provision_dir: "{{ playbook_dir }}/provision"
provision: ""

# Checks, run after configuration.
#   tests/default.yml                     every image
#   tests/<blueprint-slug>.yml            that blueprint only
lab_test_dir: "{{ playbook_dir }}/tests"

# A GCP boot plus sshd plus the guest agent injecting our key. 40 x 10s.
lab_boot_retries: 40
lab_boot_delay: 10

# On failure the VM is left running so you can SSH in and look at the thing
# that actually broke. It is deleted on success. Set false to always delete —
# useful in CI, where nobody is going to log in and look.
lab_keep_on_failure: true

# ─── Export to a bucket ──────────────────────────────────────────────────────
# After an image passes, write a portable disk file to Cloud Storage. This is
# what gets handed to anything that cannot consume a GCE image — RHDP, a
# local libvirt host, another cloud.
export: true

# Resolution order: -e export_bucket= beats the target's export_bucket, which
# beats lab_export_bucket. Same for the format.
export_bucket: ""
lab_export_bucket: rhdp_images

# qemu-img formats: qcow2, vmdk, vhdx, vpc, vdi. Empty exports the native GCE
# format instead — a tarred, gzipped disk.raw.
export_format: ""
lab_export_format: qcow2

# Object name: <prefix><image name>.<format>. The prefix is where to put a
# "lab/" or "rhel-10/" if the bucket ever needs organising.
lab_export_prefix: ""

# Export runs a Cloud Build job that boots a temporary VM and converts the
# disk — measured at 4 minutes for the 20 GB RHEL 10.2 image. This ceiling is
# for the pathological case: a much bigger disk, or a zone short on capacity.
lab_export_timeout: 2h

# Exporting over an object that already exists requires saying so. The object
# name is derived from the image name, which embeds the compose timestamp, so
# a collision means the same build — not a newer one.
force_export: false
